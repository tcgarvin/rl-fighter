[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "rlf-sim"
description = "Rust sim bindings for RL Fighter"
requires-python = ">=3.13"
dependencies = ["numpy>=2.0"]
dynamic = ["version"]

[tool.maturin]
module-name = "rlf_sim"
features = ["pyo3/extension-module"]
