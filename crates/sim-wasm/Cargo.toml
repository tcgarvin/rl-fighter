[package]
name = "sim-wasm"
version = "0.1.0"
description = "Browser (wasm-bindgen) bindings for the RL Fighter sim"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# rlib too, so the crate also builds and tests natively as a workspace member.
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sim = { path = "../sim" }
wasm-bindgen = "0.2.129"
