[package]
name = "sim-wasm"
version = "0.1.0"
description = "Browser (wasm-bindgen) bindings for the RL Fighter sim"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# rlib too, so the crate also builds and tests natively as a workspace member.
crate-type = ["cdylib", "rlib"]

[dependencies]
sim = { path = "../sim" }
wasm-bindgen = "0.2.129"
