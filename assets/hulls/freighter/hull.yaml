# Freighter (M3 stage A, SIM_VERSION 4): a convoy transport, ~26 m long, ~9 m beam.
# A sitting duck that needs protecting: unarmed, two mains, and RCS only strong
# enough to hold its heading after a knock, never to dodge (user, 2026-10-30). Flown
# by the trivial transport script (SIM_SPEC §11): cruise to the waypoint (the jump
# point) and hold heading. Role `transport` is the mission category, so a later
# "medical frigate" is just another transport-role hull. Mounts are the contract with
# the art agent's model.glb (DESIGN §5); body frame +x forward, +y port.
name: freighter
role: transport
hp: 500
mass: 300.0
inertia: 40000.0       # with 300 N heading-hold RCS: about 6 deg/s at most
speed_cap: 14.0
static: false
shield: {hp: 80, regen_rate: 6, regen_delay: 5, radius: 15}
impact:                # v3 collision damage: heavier than a strike craft, like the gunship
  - {from_deg: -180, to_deg: 180, mult: 0.75}
cost: 40
collision:
  - {pos: [8.0, 0.0], r: 4.0}
  - {pos: [0.0, 0.0], r: 4.5}
  - {pos: [-8.0, 0.0], r: 4.2}
thrusters:
  - {id: thruster.main.l, pos: [-13, 2], dir: [1, 0], max_force: 3000}
  - {id: thruster.main.r, pos: [-13, -2], dir: [1, 0], max_force: 3000}
  - {id: thruster.rcs.fl, pos: [9, 4.2], dir: [0, -1], max_force: 300}
  - {id: thruster.rcs.fr, pos: [9, -4.2], dir: [0, 1], max_force: 300}
  - {id: thruster.rcs.rl, pos: [-9, 4.4], dir: [0, -1], max_force: 300}
  - {id: thruster.rcs.rr, pos: [-9, -4.4], dir: [0, 1], max_force: 300}
turrets: []
bays: []
