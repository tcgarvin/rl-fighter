# Shielded skirmisher: weak main engine, strong lateral thrusters, fixed nose laser.
# Thrusters and turrets from prototypes/story/hulls.js; body frame +x forward, +y port.
name: strafer
role: skirmisher
hp: 70
mass: 11.0
inertia: 75.0
speed_cap: 50.0
static: false
shield: {hp: 40, regen_rate: 8, regen_delay: 3, radius: 7.5}
cost: 10
collision:
  - {pos: [0.0, 0.0], r: 3.2}
  - {pos: [0.0, 3.6], r: 2.4}
  - {pos: [0.0, -3.6], r: 2.4}
thrusters:
  - {id: thruster.main.0, pos: [-4.1, 0.0], dir: [1, 0], max_force: 380}
  - {id: thruster.lateral.fl, pos: [2.4, 4.7], dir: [0, -1], max_force: 420}
  - {id: thruster.lateral.fr, pos: [2.4, -4.7], dir: [0, 1], max_force: 420}
  - {id: thruster.lateral.rl, pos: [-2.4, 4.7], dir: [0, -1], max_force: 420}
  - {id: thruster.lateral.rr, pos: [-2.4, -4.7], dir: [0, 1], max_force: 420}
turrets:
  - {id: turret.nose, pos: [3.4, 0.0], rest_deg: 0, arc_deg: 0, slew_deg_s: 0, weapon: laser}
bays: []
