# Station (SIM_VERSION 9, station assault): an immobile, turreted capital ship with
# launch bays. Role `carrier`, so the sim treats it as its team's carrier (hangar,
# launches, the capital-ship script, the nets' carrier class) and `static` keeps it
# still: no thrusters, never integrated, infinite mass in collisions; its turrets and
# power still work. Turret mounts from web/src/render/hulls.js (a ring of flak and
# gauss covering every approach); one collision disc covers the ring.
name: station
role: carrier
hp: 1600               # balanced script vs script (lab/runs/2026-11-19-station-bomber)
mass: 5000.0
inertia: 1000000.0
speed_cap: 0.0
static: true
shield: {hp: 300, regen_rate: 20, regen_delay: 5, radius: 27}
impact:
  - {from_deg: -180, to_deg: 180, mult: 0.5}
cost: 200
collision:
  - {pos: [0.0, 0.0], r: 21.0}
thrusters: []
turrets:
  - {id: turret.flak.0, pos: [16, 0], rest_deg: 0, arc_deg: 220, slew_deg_s: 90, weapon: flak}
  - {id: turret.flak.1, pos: [-8, 13.9], rest_deg: 120, arc_deg: 220, slew_deg_s: 90, weapon: flak}
  - {id: turret.flak.2, pos: [-8, -13.9], rest_deg: -120, arc_deg: 220, slew_deg_s: 90, weapon: flak}
  - {id: turret.gauss.0, pos: [8, 13.9], rest_deg: 60, arc_deg: 220, slew_deg_s: 120, weapon: gauss}
  - {id: turret.gauss.1, pos: [-16, 0], rest_deg: 180, arc_deg: 220, slew_deg_s: 120, weapon: gauss}
  - {id: turret.gauss.2, pos: [8, -13.9], rest_deg: -60, arc_deg: 220, slew_deg_s: 120, weapon: gauss}
bays:                  # a launch leaves the mouth at pos moving along dir (SIM_SPEC §5.9)
  - {id: bay.port, pos: [0, 21], dir: [0, 1]}
  - {id: bay.starboard, pos: [0, -21], dir: [0, -1]}
