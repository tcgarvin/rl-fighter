# Dreadnought (SIM_VERSION 10): a gun capital ship that can go head to head with a
# carrier. Role `line`: flown by the scripted capital pilot (it closes on the nearest
# enemy capital and holds it off the bow), no bays, never ordered; the nets read it as
# the `spare` hull class. ~62 m long, armoured bow, soft stern: it pays to flank it.
# Every turret is a hardpoint (v10 rule 1). Mounts are the contract with the art agent
# (lab/runs/2026-11-19-citadel-dreadnought/plan.md); body frame +x forward, +y port.
# The aft rail cannot fire within 30 degrees of the bow, so pointing the armour at the
# enemy costs one main gun. Starting numbers retuned by the script-vs-script balance
# (lab/runs/2026-11-19-citadel-dreadnought/results.md).
name: dreadnought
role: line
hp: 1800
mass: 900.0
inertia: 150000.0
speed_cap: 7.0
static: false
shield: {hp: 350, regen_rate: 18, regen_delay: 5, radius: 36}
armour:                # weapon damage by the bearing of the impact
  - {from_deg: -180, to_deg: -135, mult: 1.3}   # stern
  - {from_deg: -135, to_deg: -60, mult: 0.7}    # starboard flank
  - {from_deg: -60, to_deg: 60, mult: 0.4}      # armoured bow
  - {from_deg: 60, to_deg: 135, mult: 0.7}      # port flank
  - {from_deg: 135, to_deg: 180, mult: 1.3}     # stern
impact:                # collision damage: a capital ship shrugs off rams (as the carrier)
  - {from_deg: -180, to_deg: 180, mult: 0.5}
cost: 180
collision:
  - {pos: [20.0, 0.0], r: 7.0}
  - {pos: [6.0, 0.0], r: 9.0}
  - {pos: [-10.0, 0.0], r: 9.0}
  - {pos: [-24.0, 0.0], r: 7.0}
thrusters:
  - {id: thruster.main.l, pos: [-31, 5], dir: [1, 0], max_force: 420}
  - {id: thruster.main.c, pos: [-31, 0], dir: [1, 0], max_force: 420}
  - {id: thruster.main.r, pos: [-31, -5], dir: [1, 0], max_force: 420}
  - {id: thruster.rcs.fl, pos: [22, 7], dir: [0, -1], max_force: 600}
  - {id: thruster.rcs.fr, pos: [22, -7], dir: [0, 1], max_force: 600}
  - {id: thruster.rcs.rl, pos: [-22, 8], dir: [0, -1], max_force: 600}
  - {id: thruster.rcs.rr, pos: [-22, -8], dir: [0, 1], max_force: 600}
turrets:               # hp: hardpoint hit points; hit_radius 8 (the default)
  - {id: turret.rail.fore, pos: [14, 0], rest_deg: 0, arc_deg: 300, slew_deg_s: 25, weapon: rail, hp: 220}
  - {id: turret.rail.aft, pos: [-14, 0], rest_deg: 180, arc_deg: 300, slew_deg_s: 25, weapon: rail, hp: 220}
  - {id: turret.flak.port, pos: [0, 9], rest_deg: 90, arc_deg: 200, slew_deg_s: 90, weapon: flak, hp: 120}
  - {id: turret.flak.starboard, pos: [0, -9], rest_deg: -90, arc_deg: 200, slew_deg_s: 90, weapon: flak, hp: 120}
  - {id: turret.gauss.bow, pos: [26, 0], rest_deg: 0, arc_deg: 180, slew_deg_s: 120, weapon: gauss, hp: 100}
bays: []
