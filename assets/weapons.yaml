# Weapon definitions (SIM_SPEC §4.2). Weapon ids are assigned in file order.
# Angles in degrees, durations in seconds; converted to radians/ticks on load.
# gauss: v2 duel balance (SIM_SPEC §0 item 9, chosen by the WP15 sweep in
# lab/runs/2026-10-28-sim-v2/results.md); v1 was speed 240, range 300, damage 6,
# interval 0.16, spread 0.6.
gauss:   {kind: bullet,  speed: 200, range: 220, damage: 5,  interval: 0.20, spread_deg: 1.0}
laser:   {kind: beam,    speed: 0,   range: 180, damage: 3,  interval: 0.10, spread_deg: 0.6}
flak:    {kind: flak,    speed: 180, range: 230, damage: 4,  interval: 0.09, spread_deg: 3.5,
          burst_radius: 14, fuse_jitter: 0.4}
# torpedo: the bomber's rack (v9; no hull carried it before). Range inside the station's
# turret reach so a bomber has to take fire to strike; slow and wide-turning so a
# fighter can dodge, while a capital ship cannot. v4-v8 numbers: speed 95, range 340,
# damage 55, interval 3.2, turn 40 deg/s.
torpedo: {kind: torpedo, speed: 90,  range: 240, damage: 150, interval: 4.5, spread_deg: 0,
          turn_rate_deg_s: 30, lock_cone_deg: 30, life_factor: 1.3}
# v10 (citadel and dreadnought), appended so the v9 weapon ids stay. rail: the
# dreadnought's main gun; hits anything, but its slew makes fighters hard to track.
# lance: the citadel's heavy slug (rendered beam-like); capital_only, so its shots pass
# through strike craft and scripted fire control aims it at capital ships only. Tuned
# script vs script (lab/runs/2026-11-19-citadel-dreadnought/results.md): the plan's start
# was rail 40 damage, lance 55; at those the attackers won every assault.
rail:    {kind: bullet,  speed: 260, range: 380, damage: 22, interval: 1.6, spread_deg: 0.3}
lance:   {kind: bullet,  speed: 300, range: 430, damage: 130, interval: 2.2, spread_deg: 0.2,
          capital_only: true}
