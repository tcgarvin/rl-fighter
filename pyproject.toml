[project]
name = "rl-fighter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "torch>=2.0",
    "pygame>=2.5",
    "markdown>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "maturin>=1.15.0",
]
