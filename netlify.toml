# rl-fighter.tcgarvin.com. Deployed from this machine with scripts/deploy.sh, not by
# Netlify's git builds, so there is no build command: the published directory is
# plain static files (ES modules, three.js from jsDelivr).
#
# dist/ (gitignored) is assembled by scripts/build_site.sh: the scripted story demo
# (prototypes/story/) at /, and the live learned-pilot duel (web/duel/ plus the
# sim-wasm bundle and the exported policy) at /duel/. The real client replaces it
# under web/ later (docs/DESIGN.md §9).
[build]
  publish = "dist"
  command = ""

# Module files are unhashed, so browsers must revalidate after every deploy.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/duel/pkg/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
