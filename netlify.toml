# rl-fighter.tcgarvin.com. Deployed from this machine with scripts/deploy.sh, not by
# Netlify's git builds, so there is no build command: the published directory is
# plain static files.
#
# dist/ (gitignored) is assembled by scripts/build_site.sh: the Vite build of web/
# (the live page at /, with the champion bundle at /bundle/) and the scripted story
# demo (prototypes/story/) at /story/. Redirects live in web/public/_redirects.
[build]
  publish = "dist"
  command = ""

# Module files are unhashed, so browsers must revalidate after every deploy.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/bundle/pkg/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
