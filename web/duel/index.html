<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060a10" />
    <title>RL Fighter · Learned Pilot</title>
    <meta name="description" content="A neural-network pilot, trained overnight, flying a fighter live in your browser." />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        --bg: #060a10;
        --fg: #e5e1d8;
        --muted: #8c99a8;
        --team-a: #63bfff;
        --team-b: #ffae69;
        --font: "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
        --pad-top: max(12px, env(safe-area-inset-top));
        --pad-bottom: max(12px, env(safe-area-inset-bottom));
        --pad-left: max(16px, env(safe-area-inset-left));
        --pad-right: max(16px, env(safe-area-inset-right));
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      a {
        color: inherit;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .team-a {
        color: var(--team-a);
      }
      .team-b {
        color: var(--team-b);
      }
      #topbar {
        position: absolute;
        top: var(--pad-top);
        left: var(--pad-left);
        right: var(--pad-right);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      #topbar > div:first-child {
        min-width: 0;
      }
      #kicker {
        font-size: 10px;
        letter-spacing: 0.24em;
        color: var(--muted);
      }
      #kicker .live {
        color: #ff5d5d;
      }
      #tally {
        margin-top: 4px;
        font-size: 15px;
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #meta {
        margin-top: 3px;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #perf {
        flex: none;
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1.45;
        text-align: right;
        color: var(--muted);
        opacity: 0.8;
        white-space: pre;
        font-variant-numeric: tabular-nums;
      }
      #bottom {
        position: absolute;
        bottom: var(--pad-bottom);
        left: var(--pad-left);
        right: var(--pad-right);
        display: flex;
        flex-direction: column;
        gap: 9px;
        pointer-events: auto;
      }
      #caption {
        font-size: 13px;
        line-height: 1.4;
        color: var(--fg);
        max-width: 560px;
        text-shadow: 0 0 8px var(--bg);
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--muted);
      }
      button {
        appearance: none;
        color: var(--fg);
        border: 1px solid var(--muted);
        padding: 9px 12px;
        min-height: 40px;
        font-size: 12px;
        letter-spacing: 0.04em;
        font-family: inherit;
        cursor: pointer;
        background: color-mix(in srgb, var(--bg) 70%, transparent);
        -webkit-tap-highlight-color: transparent;
      }
      .seg button {
        border: 0;
      }
      .seg button + button {
        border-left: 1px solid var(--muted);
      }
      button[aria-pressed="true"] {
        background: color-mix(in srgb, var(--fg) 16%, transparent);
        box-shadow: inset 0 -2px 0 var(--team-a);
      }
      #details-toggle[aria-pressed="true"] {
        box-shadow: none;
        border-color: var(--fg);
      }
      #links {
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      #links a {
        color: var(--muted);
        text-decoration: none;
        padding: 6px 0;
        display: inline-block;
      }
      #links a:hover {
        color: var(--fg);
      }
      #tags .tag {
        position: absolute;
        top: 0;
        left: 0;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.18em;
        white-space: pre;
        padding: 2px 5px 2px 4px;
        border-left: 2px solid currentColor;
        background: color-mix(in srgb, var(--bg) 55%, transparent);
        will-change: transform;
      }
      #tags .tag .stats {
        display: block;
        margin-top: 2px;
        font-family: var(--mono);
        font-weight: 400;
        letter-spacing: 0;
        font-size: 9px;
        line-height: 1.35;
        color: var(--fg);
      }
      #banner {
        position: absolute;
        top: 36%;
        left: var(--pad-left);
        right: var(--pad-right);
        text-align: center;
        opacity: 0;
        transition: opacity 0.5s;
        text-shadow: 0 0 12px var(--bg), 0 0 24px var(--bg);
      }
      #banner.show {
        opacity: 1;
      }
      #banner .title {
        font-size: clamp(18px, 5.6vw, 28px);
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      #banner .sub {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.06em;
      }
      @media (min-width: 720px) {
        #caption {
          font-size: 14px;
        }
        #perf {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="topbar">
        <div>
          <div id="kicker"><span class="live">●</span> LIVE</div>
          <div id="tally"></div>
          <div id="meta">loading…</div>
        </div>
        <div id="perf"></div>
      </div>
      <div id="tags"></div>
      <div id="banner"></div>
      <div id="bottom">
        <div id="caption"></div>
        <div id="controls">
          <div class="seg" id="modes" role="group" aria-label="Match-up"></div>
          <button type="button" id="details-toggle" aria-pressed="false">Details</button>
        </div>
        <div id="links"><a href="/">← Story demo</a> &nbsp;·&nbsp; <a href="/duel/notes.html">Lab notes</a></div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
