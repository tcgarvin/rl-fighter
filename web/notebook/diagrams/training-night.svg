  <text class="dg-label" x="84" y="109" text-anchor="middle">Arm B</text>
  <text class="dg-label" x="132" y="109" text-anchor="middle">Arm C</text>
  <text class="dg-small" x="162" y="80">Exact copies of the parent,</text>
  <text class="dg-small" x="162" y="94">different only in the one setting</text>
  <text class="dg-small" x="162" y="108">the night tests</text>
