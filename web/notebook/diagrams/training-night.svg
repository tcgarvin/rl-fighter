<svg class="diagram" viewBox="0 0 360 772" role="img" aria-labelledby="training-night-title training-night-desc">
  <title id="training-night-title">A night of pilot training</title>
  <desc id="training-night-desc">A vertical flow starts with Parent pilot, an existing pilot, already trained. It branches into Arm A, Arm B and an optional dashed Arm C, labelled two or three arms. These are exact copies of the parent, different only in the one setting the night tests. In the band labelled OVERNIGHT, UNATTENDED, each arm follows a long training line. Trial and error: hundreds or thousands of rounds of training. Each round plays a batch of matches and adjusts the network a little. Square markers mean saved copy. Circle markers mean quick check, on some nights: a few short practice drills. All arms reach a box labelled MORNING and Full measurements, such as. Its rows are Practice drills, short scenarios for one skill, such as following an order. Fleet fights against the script, the hand-written pilot, the yardstick. Missions against the script, the carrier battle and the other missions. An arrow leads to The season's population, every pilot trained under one version of the rules. A group of pilot dots shows the night's new pilots filled azure and labelled new, and the others outlined. Another arrow leads to Wins above replacement (WAR). Pilots, the script among them, are dropped at random into matches like the live page's. Each is scored by how many more matches in 100 its side wins than with the script flying instead. The final arrow leads to The ten best by WAR fly the live page. A dashed return arrow runs up the right margin to the parent box, labelled a later night's parent.</desc>

  <rect class="box" x="70" y="8" width="220" height="42" rx="3" />
  <text class="dg-label dg-label--strong" x="180" y="25" text-anchor="middle">Parent pilot</text>
  <text class="dg-small" x="180" y="40" text-anchor="middle">an existing pilot, already trained</text>

  <path class="dg-line" d="M180,50 V62 H84 V78 H36 V92 M84,78 V92" />
