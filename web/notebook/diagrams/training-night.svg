  <text class="dg-small dg-label--strong" x="162" y="154">OVERNIGHT, UNATTENDED</text>
  <text class="dg-small" x="162" y="174">Trial and error: hundreds</text>
  <text class="dg-small" x="162" y="187">or thousands of rounds</text>
  <text class="dg-small" x="162" y="200">of training.</text>
