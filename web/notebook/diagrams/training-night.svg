  <path class="dg-arrow" d="M163,727 L167,734 L171,727 Z" />
  <rect class="box" x="8" y="734" width="318" height="28" rx="3" />
  <text class="dg-label dg-label--strong" x="167" y="752" text-anchor="middle">The ten best by WAR fly the live page</text>

  <path class="dg-loop" d="M326,748 H346 Q352,748 352,742 V35 Q352,29 346,29 H296" />
  <path class="dg-arrow" d="M297,25 L290,29 L297,33 Z" />
  <text class="dg-small" text-anchor="middle" transform="translate(344 420) rotate(-90)">a later night's parent</text>
</svg>
