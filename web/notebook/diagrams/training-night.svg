  <text class="dg-small" x="20" y="666">at random into matches like the live page's.</text>
  <text class="dg-small" x="20" y="682">Each is scored by how many more matches in 100</text>
  <text class="dg-small" x="20" y="694">its side wins than with the script flying instead.</text>

