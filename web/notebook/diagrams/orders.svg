  <text class="dg-label dg-label--strong" x="20" y="27">Commander</text>
  <text class="dg-label" x="20" y="45">Sees the whole side and every ship.</text>
  <text class="dg-label" x="20" y="61">A network, or the hand-written</text>
  <text class="dg-label" x="20" y="74">scripted commander.</text>
  <text class="dg-label" x="20" y="90">A learned one decides once a second,</text>
  <text class="dg-label" x="20" y="103">the scripted one every two seconds.</text>

