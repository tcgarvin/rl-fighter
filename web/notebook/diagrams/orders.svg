<svg class="diagram" viewBox="0 0 360 656" role="img" aria-labelledby="orders-title orders-desc">
  <title id="orders-title">What a commander and its orders are</title>
  <desc id="orders-desc">The Commander sees the whole side and every ship. It is a network, or the hand-written scripted commander. A learned one decides once a second, the scripted one every two seconds. Thin lines connect it to squads in one side seen from above. Each squad is a group of azure strike craft. Ember craft form a group on the right labelled enemy. Attack tells a squad to go after one named enemy, shown in a target ring. Defend tells a squad to stay near a friendly ship, the ward, and fight what threatens it. A dashed ring surrounds the azure carrier serving as the ward. One approaching ember craft is labelled threat, with a dashed ember arrow toward the ward. Go-to tells a squad to fly into the circle. Once inside, the order is done and the ship is free. A clock marks that from rules version 8 a go-to can carry a deadline, so far set only in practice drills. Dock, added in rules version 11, sends one damaged ship home to its carrier to land and repair. So far only the scripted commander sends it. A single damaged dart and a curved arrow toward a carrier illustrate Dock. The bottom box shows what the pilot does with it. A strip represents the hundreds of numbers it reads each moment, with a few azure cells labelled its order. The pilot sees its order only as a few more numbers among its inputs. It still sets its own thrusters, turrets and trigger. It can follow the order or ignore it. There is no autopilot.</desc>

