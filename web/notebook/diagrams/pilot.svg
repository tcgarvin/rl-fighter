<svg class="diagram" viewBox="0 0 360 844" role="img" aria-labelledby="pilot-title pilot-desc">
  <title id="pilot-title">What a pilot sees and controls</title>
  <desc id="pilot-desc">What it sees, from its own seat. A ring marks its ship, an azure dart pointing right, with a short speed arrow ahead. Two azure friends, three ember enemies and two incoming enemy shots surround it. A thin azure order line points to a ringed enemy. It reads itself: speed, spin, hull, shield, its thrusters and guns. It reads nearby ships, nearest first: friend or foe, where they are, how they move, how damaged. It reads enemy shots coming its way and its order, if it has one (orders came in rules version 5). Everything is turned to its own point of view: forward is always where its nose points. All of it goes in as one long row of numbers, the same layout every moment. The strip groups are itself, other ships, enemy shots, its own moves on the way, and its order. Order cells are azure. Later rules versions added to the end of the row, for example go-to deadlines (8) and docking (11). An arrow leads to The pilot: a small network, illustrated by connected dots. For each setting it gives the odds of each choice, and one is drawn by those odds. An arrow leads to What it sets, 30 times a second: each thruster: less, hold or more. Each turret: turn left, hold or turn right (only the gunship's turrets turn). Each gun: fire or not. Power: how to share it between shields, engines and weapons. It sets these directly, after a short reaction delay. There is no autopilot. Turning means firing side thrusters, and aiming a nose gun means turning the whole ship. Small matching markers separate the four scene labels: an azure ring for itself, azure and ember darts for nearby ships, an ember dot for enemy shots, and an azure target ring for its order. A dashed arrow returns to the scene, labelled the game moves on, and it looks again. One network flies every hull. The gunship and bomber glyphs are larger than the fighter and strafer. Four azure ship glyphs show Fighter: main engine and four side thrusters, one gun fixed to its nose. Strafer: side thrusters and a weak main engine, one gun fixed to its nose. Gunship: slow, with three turrets that turn and aim, shown by three turret dots. Bomber: from rules version 9: slow, a torpedo fixed to its nose. Nothing tells the pilot which hull it is in. It works that out from its own thrusters and guns.</desc>

