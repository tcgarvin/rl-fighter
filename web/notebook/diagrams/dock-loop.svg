  <text class="dg-num" x="36" y="216">2</text>
  <path class="dg-a" d="M-12,-7 L6,-7 L11,-3 L11,3 L6,7 L-12,7 Z" transform="translate(58 245)" />
  <path class="dg-a" d="M-6,-4 L6,0 L-6,4 L-3,0 Z" transform="translate(105 245) rotate(180)" />
  <path class="dg-stroke-a" d="M103,235 Q85,221 72,239 M73,233 L72,239 L78,237" />
  <text class="dg-label dg-label--strong" x="126" y="216">Flies home</text>
