  <text class="dg-small" x="126" y="139">Not while it is finishing a kill,</text>
  <text class="dg-small" x="126" y="152">or while it is under an enemy</text>
  <text class="dg-small" x="126" y="165">capital ship's guns. Then it is</text>
  <text class="dg-small" x="126" y="178">recalled once clear.</text>

