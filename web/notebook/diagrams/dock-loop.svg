  <path class="dg-stroke-a" d="M85,509 H99 M96,506 L99,509 L96,512" />
  <text class="dg-label dg-label--strong" x="126" y="484">Repairs in the hangar</text>
  <text class="dg-label" x="126" y="501">Its shield is full at once.</text>
  <text class="dg-label" x="126" y="514">Its hull comes back 5% a second.</text>

  <rect class="box" x="24" y="540" width="302" height="104" rx="3" />
