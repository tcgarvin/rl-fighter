<svg class="diagram" viewBox="0 0 360 740" role="img" aria-labelledby="dock-loop-title dock-loop-desc">
  <title id="dock-loop-title">The recall loop</title>
  <desc id="dock-loop-desc">Rules version 11. The recall loop follows one carrier and one of its strike craft. Five numbered steps run from top to bottom, with a dashed return arrow labelled back into the fight. Step 1, Damaged, shows an azure dart and an ember dart shooting at each other, and a half empty bar labelled hull. Below half its hull, the scripted commander recalls it. Not while it is finishing a kill, or while it is under an enemy capital ship's guns. Then it is recalled once clear. Step 2, Flies home, shows the dart and a curved azure arrow toward its azure carrier. The pilot still flies it. The order to dock is just more numbers it reads. A short side exit arrow from step 2 leads to a crossed out dart outline, Shot down on the way. When scripts fly every ship, about 3 recalls in 5 end in a dock (0.54 to 0.64 by mission). Nearly all the rest are shot down on the way. Step 3, Docks, shows a carrier with one bay mouth and a small dart arriving nose first at the dashed circle at the mouth. It is taken in within 10 m of a bay's mouth, moving no faster than 15 m/s against the bay. Step 4, Repairs in the hangar, shows the dart inside its carrier and a filling bar labelled hull. Its shield is full at once. Its hull comes back 5% a second. Step 5, Launches again, shows the dart leaving the bay with a short arrow. From 4 s after docking, as the same ship with the same pilot. The scripted commander waits until it has 90% of its hull, unless it needs craft fast. The notes say: If the carrier is destroyed, the craft in its hangar go with it. A station takes its craft back the same way. Only a commander recalls. Learned commanders cannot recall yet.</desc>

