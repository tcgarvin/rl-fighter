  <rect class="dg-chip" x="63" y="589" width="5" height="6" rx="1" />
  <path class="dg-stroke-a" d="M70,592 H91 M87,588 L91,592 L87,596" />
  <path class="dg-a" d="M-6,-4 L6,0 L-6,4 L-3,0 Z" transform="translate(105 592)" />
  <text class="dg-label dg-label--strong" x="126" y="558">Launches again</text>
  <text class="dg-label" x="126" y="575">From 4 s after docking, as the</text>
  <text class="dg-label" x="126" y="588">same ship with the same pilot.</text>
  <text class="dg-small" x="126" y="607">The scripted commander waits</text>
  <text class="dg-small" x="126" y="620">until it has 90% of its hull,</text>
  <text class="dg-small" x="126" y="633">unless it needs craft fast.</text>

  <path class="dg-loop" d="M326,592 H346 Q352,592 352,586 V130 Q352,124 346,124 H332" />
  <path class="dg-arrow" d="M333,120 L326,124 L333,128 Z" />
  <text class="dg-small" text-anchor="middle" transform="translate(340 450) rotate(-90)">back into the fight</text>

  <rect class="box" x="8" y="654" width="344" height="82" rx="3" />
  <text class="dg-small" x="20" y="668">If the carrier is destroyed, the craft in its</text>
  <text class="dg-small" x="20" y="681">hangar go with it.</text>
  <text class="dg-small" x="20" y="699">A station takes its craft back the same way.</text>
  <text class="dg-small" x="20" y="716">Only a commander recalls. Learned commanders</text>
  <text class="dg-small" x="20" y="729">cannot recall yet.</text>
</svg>
