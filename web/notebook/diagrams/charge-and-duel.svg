    <path class="dg-b" transform="translate(259.6 418) rotate(180)" d="M-6,-4 L6,0 L-6,4 L-3,0 Z" />
  </g>
  <text class="dg-small" x="20" y="444">The free side has stopped falling back.</text>
  <text class="dg-small" x="20" y="457">The duels are on.</text>
  <text class="dg-small" x="20" y="470">Ships lost so far, a match: ordered 0.47, free 0.16</text>
  <rect class="box" x="8" y="486" width="344" height="104" rx="3" />
  <text class="dg-label dg-label--strong" x="20" y="502">28 s</text>
  <text class="dg-small" x="176.55" y="502" text-anchor="middle">261 m</text>
  <path class="dg-line" d="M 104.775 509 H 248.325 M 104.775 506 V 512 M 248.325 506 V 512" />
