<svg class="diagram" viewBox="0 0 360 987" role="img" aria-labelledby="charge-and-duel-title charge-and-duel-desc">
  <title id="charge-and-duel-title">What an attack order does in a fleet fight</title>
  <desc id="charge-and-duel-desc">Three ships a side, the first 30 seconds. Measured on the order-cost night: the same four order-following pilots on both sides. Azure: every ship ordered to attack the enemy nearest it. Ember: free, its orders hidden from its pilots. Only the gap is to scale. Arrows show direction. Four frames show the gap between the fleets' centres at the same scale, with azure darts facing the ember fleet. At 0 s, the gap is 482 m. Both fleets fly in, with arrows showing direction and no target rings because no order has been given yet. From 4 s on, short azure order arrows point toward target rings. At 4 s, the gap is 365 m. Orders since 2 s. The ordered side keeps flying at its targets, at 12 to 16 m/s. The free side turns and runs, as fast as 29 m/s away. The ember darts face away, with a motion arrow pointing right. At 20 s, the gap is 302 m. The free side has stopped falling back. The duels are on. Ships lost so far, a match: ordered 0.47, free 0.16. At 28 s, the gap is 261 m. Ships lost so far, a match: ordered 0.93, free 0.47. Two azure darts remain, with a small x marking a lost ship. Three ember darts remain. In the last two frames the ember darts face the fight. For comparison, no orders on either side: both fleets close to about 370 m, then both fall back to about 500 m by 8 s. Almost no ship is lost before 14 s. The duel, close up: an azure ship faces its ringed ember target, linked by an azure order arrow. Another ember ship crosses the azure ship's nose inside a narrow dashed gun arc and passes unshot. Beside it, the label a free ship takes the shot identifies an ember pilot shooting at an azure ship crossing its nose. The ordered pilot shoots only its target. A free pilot takes whatever shot comes. Damage in the first 30 s, a match, compares the Ordered side and Free side. Damage dealt to its own target: 101 and 112. Damage dealt to other enemies: 2 and 40. Damage taken from its own target: 127 and 71. For the free side, its own target is the enemy its hidden order named. The first ship lost was the ordered side's in 0.68 of matches, and 0.73 of those were killed by the very enemy they were sent at. The ordered ship charges, duels its one target, and loses.</desc>
  <text class="dg-small dg-label--strong" x="20" y="18">Three ships a side, the first 30 seconds</text>
  <text class="dg-small" x="20" y="34">Measured on the order-cost night: the same four</text>
  <text class="dg-small" x="20" y="47">order-following pilots on both sides.</text>
  <text class="dg-small" x="20" y="63">Azure: every ship ordered to attack the enemy nearest it.</text>
  <text class="dg-small" x="20" y="76">Ember: free, its orders hidden from its pilots.</text>
  <text class="dg-small" x="20" y="90">Only the gap is to scale. Arrows show direction.</text>
