    <path class="dg-b" transform="translate(248.325 520) rotate(180)" d="M-6,-4 L6,0 L-6,4 L-3,0 Z" />
    <path class="dg-b" transform="translate(248.325 538) rotate(180)" d="M-6,-4 L6,0 L-6,4 L-3,0 Z" />
    <path class="dg-b" transform="translate(248.325 556) rotate(180)" d="M-6,-4 L6,0 L-6,4 L-3,0 Z" />
  </g>
  <text class="dg-small" x="20" y="582">Ships lost so far, a match: ordered 0.93, free 0.47</text>
  <rect class="box" x="8" y="598" width="344" height="66" rx="3" />
  <text class="dg-label dg-label--strong" x="20" y="614">For comparison, no orders on either side</text>
  <text class="dg-small" x="20" y="630">Both fleets close to about 370 m, then both fall</text>
  <text class="dg-small" x="20" y="643">back to about 500 m by 8 s.</text>
  <text class="dg-small" x="20" y="656">Almost no ship is lost before 14 s.</text>
  <rect class="box" x="8" y="672" width="344" height="235" rx="3" />
