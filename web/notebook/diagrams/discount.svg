<svg class="diagram" viewBox="0 0 360 510" role="img" aria-labelledby="discount-title discount-desc">
  <title id="discount-title">What the discount does</title>
  <desc id="discount-desc">How much a reward counts, against 1 for a reward now, by how many seconds ahead it comes. The entries call the discount gamma. How far ahead it reaches is the horizon. The chart runs from 0 to 40 seconds ahead, with ticks at 0, 10, 20, 30 and 40 and the axis title seconds ahead. The vertical scale marks 0, 0.5 and 1. Three falling curves are labelled directly: 0.99 is dashed, 0.995 is a thin solid line, and 0.999 is a thicker solid line. A dashed marker at 30 seconds joins two dots. At 30 seconds, 0.999 gives 0.41 and 0.995 gives 0.011. A table has the headings Discount, 1 s, 10 s, 30 s, and reaches about. The 0.99 row reads 0.74, 0.05, 0.0001, and 3.3 s. The 0.995 row reads 0.86, 0.22, 0.011, and 6.7 s. The 0.999 row reads 0.97, 0.74, 0.41, and 33 s. Each number is how much a reward that far ahead counts. Reaches about: the rough span of seconds the pilot weighs.</desc>

  <text class="dg-label dg-label--strong" x="20" y="24">What the discount does</text>
  <text class="dg-small" x="20" y="41">How much a reward counts, against 1 for a reward now, by</text>
  <text class="dg-small" x="20" y="54">how many seconds ahead it comes. The entries call the</text>
  <text class="dg-small" x="20" y="67">discount gamma. How far ahead it reaches is the horizon.</text>

