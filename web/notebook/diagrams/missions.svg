<svg class="diagram" viewBox="0 0 360 752" role="img" aria-labelledby="missions-title missions-desc">
  <title id="missions-title">The four missions</title>
  <desc id="missions-desc">Azure and ember are the two sides. Each map is seen from above. A shared dashed arc legend means jumping in. Four panels show round arenas. At top left, Team deathmatch, subtitled fleet fight, shows three azure strike craft jumping in from the left and three ember strike craft from the right, facing each other. Strike craft only, one to four a side. Win by destroying every enemy. At the time limit (90 s) the side with more hull and shields left wins. At top right, Carrier battle, subtitled a carrier a side, shows a carrier at each side, two strike craft jumping in ahead of each, and a short arrow from each carrier bay to a departing craft. Each side has a carrier that launches its strike craft. Win by destroying the enemy carrier. At the time limit (150 s) the side whose carrier has more hull left wins. At bottom left, Convoy escort, subtitled freighters and their escort, shows three azure freighters in a column heading up, azure escorts on either side, a dashed route to a dashed circle labelled jump point, and ember attackers arriving from both sides. Escorts guard freighters flying to a jump point, where they charge and jump out. The other side attacks. The attacker wins by destroying at least half the freighters. The defender wins when more than half escape. At the time limit (120 s) the attacker wins. At bottom right, Station assault, subtitled rules version 9 on, shows a fixed azure station with turret dots and two nearby guards on the left. An ember carrier is on the right, with strike craft jumping in ahead of it and wider chevrons labelled bombers heading toward the station. A dashed ember warship beside the carrier is labelled dreadnought. A fixed station defends with its own ships and a reserve inside. The attacker brings a carrier, bombers and, from rules version 10, a dreadnought. It wins only by destroying the station. At the time limit (150 s) the defender wins. From rules version 10 the station is the much bigger citadel.</desc>

