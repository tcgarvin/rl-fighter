<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RL Fighter</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        --bg: #05060a;
        --fg: #e8ecf2;
        --muted: #7d8696;
        --team-a: #4fb3ff;
        --team-b: #ff8a3d;
        --font: ui-monospace, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        /* Above the draft overlay, so the top bar and controls stay usable during it. */
        z-index: 4;
      }
      #topbar {
        position: absolute;
        top: 12px;
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        letter-spacing: 0.06em;
      }
      .team-a {
        color: var(--team-a);
        --team: var(--team-a);
      }
      .team-b {
        color: var(--team-b);
        --team: var(--team-b);
      }
      #score {
        font-size: 15px;
      }
      #meta {
        color: var(--muted);
      }
      #controls {
        position: absolute;
        bottom: 12px;
        left: 16px;
        right: 16px;
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        gap: 8px;
        pointer-events: auto;
        z-index: 3;
      }
      #controls button {
        flex: none;
        white-space: nowrap;
        color: var(--fg);
        border: 1px solid var(--muted);
        padding: 6px 10px;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        background: color-mix(in srgb, var(--bg) 70%, transparent);
      }
      #controls button[aria-pressed="true"] {
        border-color: var(--fg);
        background: color-mix(in srgb, var(--fg) 15%, transparent);
      }
      #details .ship-label {
        position: absolute;
        top: 0;
        left: 0;
        white-space: pre;
        font-size: 10px;
        line-height: 1.3;
        font-variant-numeric: tabular-nums;
        padding: 2px 4px;
        background: color-mix(in srgb, var(--bg) 65%, transparent);
        border-left: 2px solid currentColor;
      }
      #banner {
        position: absolute;
        top: 34%;
        left: 16px;
        right: 16px;
        text-align: center;
        letter-spacing: 0.12em;
        opacity: 0;
        transition: opacity 0.6s;
        text-shadow: 0 0 12px var(--bg), 0 0 24px var(--bg);
      }
      #banner.show {
        opacity: 1;
      }
      #banner .brief-title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }
      #banner .brief-text {
        margin-top: 8px;
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.06em;
      }

      /* ---- Fleet draft overlay ---- */
      #draft {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 14px;
        /* Full-width dimming; the content column stays at most 760px wide. */
        padding: 48px max(16px, calc(50% - 380px)) 64px;
        box-sizing: border-box;
        background: radial-gradient(ellipse at 50% 55%, color-mix(in srgb, var(--bg) 35%, transparent), color-mix(in srgb, var(--bg) 88%, transparent) 75%);
        transition: opacity 0.45s;
      }
      #draft[hidden] {
        display: none;
      }
      #draft.closing {
        opacity: 0;
      }
      .draft-title {
        text-align: center;
        transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .draft-title .kicker {
        font-size: 11px;
        letter-spacing: 0.3em;
        color: var(--muted);
      }
      .draft-title .name {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.16em;
        margin-top: 2px;
      }
      .draft-title .brief {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        letter-spacing: 0.04em;
      }
      #draft.intro .draft-title {
        transform: translateY(26vh) scale(1.25);
      }
      #draft.intro .draft-title .name {
        animation: title-in 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #draft.intro .sides,
      #draft.intro .stage {
        opacity: 0;
      }
      .sides,
      .stage {
        transition: opacity 0.5s;
      }
      @keyframes title-in {
        0% {
          opacity: 0;
          letter-spacing: 0.6em;
          filter: blur(6px);
        }
        100% {
          opacity: 1;
          letter-spacing: 0.16em;
          filter: blur(0);
        }
      }
      .sides {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .side {
        border-top: 2px solid color-mix(in srgb, var(--team) 40%, transparent);
        padding-top: 6px;
        transition: border-color 0.2s;
      }
      .side.active {
        border-top-color: var(--team);
      }
      .side-head {
        font-size: 12px;
        letter-spacing: 0.12em;
        font-weight: 700;
      }
      .side-head .persona {
        color: var(--muted);
        font-weight: 400;
        margin-left: 4px;
      }
      .budget {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 5px 0 6px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .budget-bar {
        flex: 1;
        height: 3px;
        background: color-mix(in srgb, var(--fg) 12%, transparent);
      }
      .budget-bar i {
        display: block;
        height: 100%;
        width: 100%;
        background: var(--team);
        transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .roster {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
        gap: 4px;
        min-height: 54px;
      }
      .chip {
        position: relative;
        background: color-mix(in srgb, var(--team) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--team) 35%, transparent);
        text-align: center;
      }
      .chip img {
        display: block;
        width: 100%;
        aspect-ratio: 22 / 15;
        object-fit: contain;
      }
      .chip-label {
        display: block;
        font-size: 8px;
        letter-spacing: 0.1em;
        padding: 0 0 2px;
      }
      .chip.fixed {
        grid-column: span 2;
        border-color: var(--team);
        background: color-mix(in srgb, var(--team) 20%, transparent);
      }
      .chip.slam {
        animation: slam 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes slam {
        0% {
          transform: scale(2.2) translateY(30px);
          opacity: 0;
          box-shadow: 0 0 0 0 var(--team);
        }
        60% {
          transform: scale(0.94);
          opacity: 1;
          box-shadow: 0 0 18px 2px var(--team);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 transparent;
        }
      }
      .stage {
        margin-top: auto;
        text-align: center;
      }
      .who {
        font-size: 13px;
        letter-spacing: 0.14em;
        font-weight: 700;
        margin-bottom: 10px;
        min-height: 1.3em;
      }
      .who .thinking {
        color: var(--muted);
        font-weight: 400;
        animation: blink 0.5s steps(2) infinite;
      }
      .who .locked-in {
        color: var(--fg);
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      .stage.done .who {
        font-size: 20px;
        letter-spacing: 0.3em;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        min-height: 10px;
        max-width: 540px;
        margin: 0 auto;
      }
      .card {
        border: 1px solid color-mix(in srgb, var(--team) 40%, transparent);
        background: color-mix(in srgb, var(--bg) 70%, transparent);
        padding: 6px 6px 8px;
        text-align: left;
        animation: deal 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        transition: transform 0.25s, opacity 0.25s, border-color 0.2s, box-shadow 0.25s;
      }
      .card:nth-child(2) {
        animation-delay: 0.05s;
      }
      .card:nth-child(3) {
        animation-delay: 0.1s;
      }
      @keyframes deal {
        from {
          opacity: 0;
          transform: translateY(24px) rotateX(50deg);
        }
      }
      .card img {
        display: block;
        width: 100%;
        aspect-ratio: 22 / 15;
        object-fit: contain;
      }
      .card-name {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        margin-top: 2px;
      }
      .card-cost {
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .card-blurb {
        font-size: 10px;
        color: var(--muted);
        line-height: 1.3;
        margin: 4px 0 6px;
        min-height: 2.6em;
      }
      .card-bar {
        height: 4px;
        background: color-mix(in srgb, var(--fg) 10%, transparent);
      }
      .card-bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--team);
      }
      .card.locked {
        transform: scale(1.07);
        border-color: var(--team);
        box-shadow: 0 0 24px -2px var(--team), inset 0 0 18px -6px var(--team);
      }
      .card.rejected {
        opacity: 0.28;
        transform: scale(0.94);
        filter: grayscale(0.7);
      }
      .reason {
        margin-top: 12px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2em;
        min-height: 1.3em;
        opacity: 0;
      }
      .reason.show {
        animation: reason-in 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes reason-in {
        0% {
          opacity: 0;
          transform: scale(1.6);
          filter: blur(4px);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      body[data-phase="draft"] #score {
        display: none;
      }

      @media (max-width: 640px) {
        #topbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 4px;
          font-size: 10px;
        }
        #score,
        #meta {
          white-space: nowrap;
        }
        #score {
          font-size: 12px;
        }
        #hud #details .ship-label {
          font-size: 9px;
        }
        #banner .brief-title {
          font-size: 20px;
        }
        #banner .brief-text {
          font-size: 11px;
        }
        #controls button {
          padding: 9px 12px;
        }
        #draft {
          padding-top: 40px;
        }
        .draft-title .name {
          font-size: 19px;
        }
        .card-blurb {
          font-size: 9px;
        }
        .card-name {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body data-phase="draft">
    <div id="draft" hidden></div>
    <div id="hud">
      <div id="topbar">
        <div id="score"></div>
        <div id="meta"></div>
      </div>
      <div id="banner"></div>
      <div id="details" hidden></div>
      <div id="controls"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
