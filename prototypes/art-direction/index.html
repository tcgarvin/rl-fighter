<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RL Fighter</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        --bg: #05060a;
        --fg: #e8ecf2;
        --muted: #7d8696;
        --team-a: #4fb3ff;
        --team-b: #ff8a3d;
        --font: ui-monospace, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #topbar {
        position: absolute;
        top: 12px;
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        letter-spacing: 0.06em;
      }
      .team-a {
        color: var(--team-a);
      }
      .team-b {
        color: var(--team-b);
      }
      #score {
        font-size: 15px;
      }
      #meta {
        color: var(--muted);
      }
      #styles {
        position: absolute;
        bottom: 12px;
        left: 16px;
        right: 16px;
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        gap: 8px;
        pointer-events: auto;
      }
      #styles a,
      #styles button {
        color: var(--fg);
        border: 1px solid var(--muted);
        padding: 6px 10px;
        text-decoration: none;
        font-size: 12px;
        background: color-mix(in srgb, var(--bg) 70%, transparent);
      }
      #styles button {
        font-family: inherit;
        cursor: pointer;
      }
      #styles button[aria-pressed="true"],
      #styles a.active {
        border-color: var(--fg);
        background: color-mix(in srgb, var(--fg) 15%, transparent);
      }
      #blurb {
        position: absolute;
        bottom: 52px;
        left: 16px;
        right: 16px;
        color: var(--muted);
        font-size: 12px;
        max-width: 640px;
      }
      #styles a,
      #styles button {
        flex: none;
        white-space: nowrap;
      }
      @media (max-width: 640px) {
        #blurb {
          display: none;
        }
        #topbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 4px;
          font-size: 10px;
        }
        #score,
        #meta {
          white-space: nowrap;
        }
        #hud #details .ship-label {
          font-size: 9px;
        }
        #score {
          font-size: 13px;
        }
        #banner {
          font-size: 14px;
        }
        #banner .rosters {
          gap: 20px;
          font-size: 11px;
        }
        #styles a,
        #styles button {
          padding: 9px 12px;
        }
      }
      #details .ship-label {
        position: absolute;
        top: 0;
        left: 0;
        white-space: pre;
        font-size: 10px;
        line-height: 1.3;
        font-variant-numeric: tabular-nums;
        padding: 2px 4px;
        background: color-mix(in srgb, var(--bg) 65%, transparent);
        border-left: 2px solid currentColor;
      }
      #banner {
        position: absolute;
        top: 38%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 18px;
        letter-spacing: 0.12em;
        opacity: 0;
        transition: opacity 0.6s;
        text-shadow: 0 0 12px var(--bg);
      }
      #banner.show {
        opacity: 1;
      }
      #banner .rosters {
        display: flex;
        justify-content: center;
        gap: 48px;
        margin-top: 10px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="topbar">
        <div id="score"></div>
        <div id="meta"></div>
      </div>
      <div id="banner"></div>
      <div id="details" hidden></div>
      <div id="blurb"></div>
      <div id="styles"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
